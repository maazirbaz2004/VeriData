[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ads"
version = "0.1.0"
description = "VeriData Agentic Data Scientist — Phase 1: Deterministic Ingestion, Profiling, Cleaning, EDA, and LLM Comparison"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jinja2>=3.1.2",
    "markdown>=3.5.0",
    "typer>=0.9.0",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.25.0",
]
notebooks = [
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "nbformat>=5.9.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "ruff>=0.3.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
ads = "ads.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
