# Per-dataset configuration for Bank Marketing — bank-additional-full (UCI id 222) (Section 5.1, 5.4)
# Source: https://archive.ics.uci.edu/dataset/222/bank+marketing  (file: bank-additional/bank-additional-full.csv, ';'-delimited)
name: bank_marketing
file: data/raw/bank_marketing/bank-additional-full.csv
target: y
profiling:
  # The source documentation says every missing categorical value is coded as "unknown"
  # (job, marital, education, default, housing, loan). Section 8 DECISION: Bank Marketing lists it.
  treat_unknown_as_missing: true
# NOTE: pdays = 999 means "never contacted before" (a sentinel, not a missing value). It is left
# as-is on purpose and documented in docs/datasets.md; turning it into NaN would wipe ~96% of the column.
# NOTE: duration is only known after the call ends (target leakage for prediction). Kept for EDA.
validity_rules:
  age:
    min: 0
    max: 120
  duration:
    min: 0
  campaign:
    min: 1
  pdays:
    min: 0
  previous:
    min: 0
truth_types:
  age: numeric
  job: categorical
  marital: categorical
  education: categorical
  default: binary
  housing: binary
  loan: binary
  contact: binary
  month: categorical
  day_of_week: categorical
  duration: numeric
  campaign: numeric
  pdays: numeric
  previous: numeric
  poutcome: categorical
  emp.var.rate: numeric
  cons.price.idx: numeric
  cons.conf.idx: numeric
  euribor3m: numeric
  nr.employed: numeric
  y: binary
