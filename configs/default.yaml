# Global Default Configuration for VeriData Agentic Data Scientist (Phase 1)
# Per-dataset configs in configs/datasets/<name>.yaml override these settings.

ingestion:
  max_file_size_mb: 200.0
  encodings_to_try:
    - "utf-8"
    - "utf-8-sig"
    - "latin-1"
    - "cp1252"
  delimiters_to_try:
    - ","
    - ";"
    - "\t"
    - "|"

type_inference:
  numeric_parse_threshold: 0.95
  discrete_max_unique: 20
  discrete_max_ratio: 0.05
  datetime_parse_threshold: 0.90
  month_first_default: false
  id_unique_ratio: 0.98
  id_min_nonnull: 50
  text_mean_len: 40.0
  text_mean_words: 6.0
  text_unique_ratio: 0.50
  max_categorical_unique: 50
  categorical_max_ratio: 0.05

profiling:
  missing_tokens:
    - ""
    - " "
    - "NA"
    - "N/A"
    - "n/a"
    - "NaN"
    - "nan"
    - "NULL"
    - "null"
    - "None"
    - "none"
    - "?"
    - "-"
    - "--"
    - "missing"
    - "#N/A"
  candidate_missing_tokens:
    - "unknown"
    - "Unknown"
    - "UNKNOWN"
  treat_unknown_as_missing: false
  label_similarity_threshold: 0.90
  high_missing_warning_threshold: 0.40
  extreme_skew_warning_threshold: 2.0
  minority_imbalance_threshold: 0.10
  outlier_iqr_mild: 1.5
  outlier_iqr_extreme: 3.0
  outlier_modz_threshold: 3.5

cleaning:
  snake_case_columns: false
  auto_merge_fuzzy: false
  missing_token_warning_ratio: 0.10
  drop_duplicates: "auto"           # always | never | auto
  duplicate_auto_max_cols: 4
  duplicate_auto_max_rate: 0.20
  column_drop_threshold: 0.80       # dropped in imputed output only; marked excluded in conservative
  row_drop_threshold: 0.50          # dropped in both outputs if > 50% of cells in row are missing
  categorical_missing_as_level_threshold: 0.05
  missing_indicator_threshold: 0.05
  target_missing: "drop"            # drop | keep (for imputed output)
  outlier_action: "flag"            # flag | cap | remove
  outlier_remove_max_row_fraction: 0.05
  steps_enabled:
    normalize_column_names: true
    clean_whitespace_unicode: true
    normalize_missing_tokens: true
    standardize_categories: true
    convert_types: true
    apply_validity_rules: true
    handle_duplicates: true
    structural_drops: true
    handle_missing_values: true
    handle_outliers: true
    validate_invariants: true

eda:
  dpi: 150
  max_numeric_plots: 30
  max_categorical_plots: 30
  batch_panel_size: 6
  top_categories_shown: 15
  missing_heatmap_max_rows: 500
  scatter_max_points: 5000
  top_bivariate_pairs: 6
  max_group_levels_box: 8
  collinearity_threshold: 0.90

scaling:
  skew_threshold: 1.0
  scale_disparity_ratio_threshold: 10.0
  generate_scaled_csv: true

insights:
  zero_inflation_threshold: 0.30
  outlier_pct_threshold: 0.05
  rare_level_threshold: 0.01
  small_n_dataset_threshold: 200
  small_n_group_threshold: 20

# Phases 2-8 global configuration (Master Plan Section 6)
stats:
  alpha: 0.05
  correction: "bh"                  # bh | by | holm | bonferroni | none
  two_sided: true
  min_n_pairwise: 20
  min_group_n: 8
  min_expected_count_chi2: 5
  normality_n_max: 5000
  large_n_clt: 50
  extreme_skew: 2.0
  bootstrap_resamples: 2000
  bootstrap_resamples_benchmark: 500
  permutation_resamples: 9999
  seed: 20260101
  ci_candidate_p: 0.10
  yates: false
  strict_ci: false
  test_timeout_s: 20.0
  assumption_aware_selection: true
  enable_assumption_gate: true
  benchmark_fast_mode: false

effect_floor:
  cohens_d: 0.20
  rank_biserial: 0.10
  correlation: 0.10
  eta_squared: 0.01
  epsilon_squared: 0.01
  cramers_v_df1: 0.10
  enabled: true

hypotheses:
  mode: "exhaustive"                # exhaustive | target_focused | llm_prioritized
  target: null
  max_tests: 3000
  max_levels_categorical: 20
  small_discrete_max_unique: 10
  treat_small_discrete_as_numeric: false
  lump_rare_levels: false
  rare_level_min_fraction: 0.01
  enable_nonlinear: false
  llm_proposals: true
  max_llm_proposals: 40
  min_llm_hypotheses: 10
  ranking_weights:
    feasibility_strength: 0.25
    target_involvement: 0.30
    llm_relevance: 0.25
    interpretability: 0.10
    data_quality: 0.10

llm:
  provider: "anthropic"
  model: "claude-sonnet-4-5"
  temperature: 0.0
  max_tokens: 2000
  cache_dir: ".cache/llm"
  retries: 2

reporting:
  narration: "llm_slots"            # llm_slots | template_only
  max_findings_in_report: 30
  charts_dpi: 150

agent:
  checkpoint: "sqlite"              # memory | sqlite
  max_followups: 3
  max_tool_calls_per_turn: 4


